# Basic font defaults; use an installed Nerd Font to display Starship's icon glyphs.
font_family monospace
font_size 12.0
# Tokyonight Moon colors shared with tmux; selection/cursor use contrasting shades.
background #222436
foreground #c8d3f5
selection_background #3b4261
cursor #c8d3f5
# Inset text from window borders by this many points.
window_padding_width 10
# 0 disables Kitty's confirmation dialog when closing an OS window.
confirm_os_window_close 0
