# ~/.config/starship.toml

"$schema" = "https://starship.rs/config-schema.json"

palette = "dracula"

format = """
[](fg:purple)\
$os\
$username\
[](fg:purple bg:cyan)\
$directory\
[](fg:cyan bg:pink)\
$git_branch\
$git_status\
[](fg:pink bg:green)\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:green bg:orange)\
$jobs\
[](fg:orange bg:comment)\
$time\
[ ](fg:comment)\
$cmd_duration\
$line_break\
$character"""

# ─────────────────────────────────────────────
# OS
# ─────────────────────────────────────────────

[os]
disabled = false
style = "fg:background bg:purple"
format = "[ $symbol]($style)"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󱄛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
CachyOS = "󰣇"

# ─────────────────────────────────────────────
# USER
# ─────────────────────────────────────────────

[username]
show_always = true
style_user = "fg:background bg:purple"
style_root = "fg:foreground bg:red"
format = "[ $user ]($style)"

# ─────────────────────────────────────────────
# DIRECTORY
# ─────────────────────────────────────────────

[directory]
style = "fg:background bg:cyan"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Documentos" = "󰈙 "
"Downloads" = " "
"Descargas" = " "
"Music" = "󰝚 "
"Música" = "󰝚 "
"Pictures" = " "
"Imágenes" = " "
"Developer" = "󰲋 "
"git" = " "
".config" = " "

# ─────────────────────────────────────────────
# GIT
# ─────────────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:background bg:pink"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:background bg:pink"
format = "[$all_status$ahead_behind ]($style)"

# ─────────────────────────────────────────────
# PROGRAMMING LANGUAGES
# ─────────────────────────────────────────────

[nodejs]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[c]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[php]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[java]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[kotlin]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[haskell]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:background bg:green"
format = "[ $symbol $version( \\(#$virtualenv\\)) ]($style)"

# ─────────────────────────────────────────────
# JOBS
# ─────────────────────────────────────────────

[jobs]
symbol = "󰍦 "
style = "fg:background bg:orange"
format = "[ $symbol$number jobs ]($style)"
threshold = 1
number_threshold = 1

# ─────────────────────────────────────────────
# TIME
# ─────────────────────────────────────────────

[time]
disabled = false
time_format = "%R"
style = "fg:background bg:comment"
format = "[  $time ]($style)"

# ─────────────────────────────────────────────
# COMMAND DURATION
# ─────────────────────────────────────────────

[cmd_duration]
disabled = false
show_milliseconds = true
min_time = 2000
format = "[ in $duration ]($style)"
style = "fg:comment"
show_notifications = false
min_time_to_notify = 45000

# ─────────────────────────────────────────────
# LINE BREAK
# ─────────────────────────────────────────────

[line_break]
disabled = false

# ─────────────────────────────────────────────
# CHARACTER
# ─────────────────────────────────────────────

[character]
disabled = false

success_symbol = "[λ ❯](bold fg:green)"
error_symbol = "[λ ❯](bold fg:red)"

vimcmd_symbol = "[λ ❮](bold fg:green)"
vimcmd_replace_one_symbol = "[λ ❮](bold fg:purple)"
vimcmd_replace_symbol = "[λ ❮](bold fg:purple)"
vimcmd_visual_symbol = "[λ ❮](bold fg:yellow)"

# ─────────────────────────────────────────────
# DRACULA PALETTE
# ─────────────────────────────────────────────

[palettes.dracula]

# Background
background = "#282a36"
current_line = "#44475a"
selection = "#44475a"

# Text
foreground = "#f8f8f2"
comment = "#6272a4"

# Main colors
cyan = "#8be9fd"
green = "#50fa7b"
orange = "#ffb86c"
pink = "#ff79c6"
purple = "#bd93f9"
red = "#ff5555"
yellow = "#f1fa8c"

# Extras
white = "#f8f8f2"
gray = "#6272a4"
dark_gray = "#44475a"
black = "#282a36"

overlay0 = "#44475a"
overlay1 = "#6272a4"
overlay2 = "#8be9fd"
