# ============================================================
# Configuration reload
# ============================================================

unbind r

bind R source-file ~/.tmux.conf \;\
    display-message "Tmux configuration reloaded!"

# ============================================================
# FZF Session Picker
# ============================================================

bind r display-popup \
    -E \
    -w 65% \
    -h 50% \
    -T " 󰆍 Tmux Sessions " \
    "~/.config/tmux/session-picker.sh"

# Basic settings
set -g default-terminal "tmux-256color"
# Advertise true color only for terminals known to support it.
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB,foot*:RGB,alacritty:RGB'
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g mouse on
set -g set-clipboard on
set-option -g status-position top

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Create windows in the active pane's directory.
bind c new-window -c "#{pane_current_path}"
# Resize repeatedly while the prefix remains active.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z
bind ? list-keys

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Start numbering
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Keep mouse selections available for review; press y to copy.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi Escape send-keys -X cancel
# Prefer the desktop clipboard when available; OSC 52 remains enabled above.
if-shell 'command -v xclip >/dev/null 2>&1 && test -n "$DISPLAY"' \
    'set -s copy-command "xclip -in -selection clipboard >/dev/null 2>&1"'
if-shell 'command -v wl-copy >/dev/null 2>&1 && test -n "$WAYLAND_DISPLAY"' \
    'set -s copy-command "wl-copy"'

# Tokyonight Moon theme colors
thm_bg="#222436"
thm_fg="#c8d3f5"
thm_cyan="#86e1fc"
thm_black="#1b1d2b"
thm_gray="#3a3f5a"
thm_magenta="#c099ff"
thm_pink="#ff757f"
thm_red="#ff757f"
thm_green="#c3e88d"
thm_yellow="#ffc777"
thm_blue="#82aaff"
thm_orange="#ff9e64"
thm_black4="#444a73"

# Status bar
set -g status "on"
set -g status-bg "${thm_bg}"
set -g status-justify "left"
set -g status-left-length "100"
set -g status-right-length "100"

# Messages
set -g message-style "fg=${thm_cyan},bg=${thm_gray},align=centre"
set -g message-command-style "fg=${thm_cyan},bg=${thm_gray},align=centre"

# Panes
set -g pane-border-style "fg=${thm_gray}"
set -g pane-active-border-style "fg=${thm_blue}"

# Windows
set -g window-status-activity-style "fg=${thm_fg},bg=${thm_bg},none"
set -g window-status-separator ""
set -g window-status-style "fg=${thm_fg},bg=${thm_bg},none"

# Statusline - current window
set -g window-status-current-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_magenta},bg=${thm_bg}](✓) #[fg=${thm_cyan},bg=${thm_bg}]#{b:pane_current_path} #[fg=${thm_magenta},bg=${thm_bg}]"

# Statusline - other windows
set -g window-status-format "#[fg=${thm_blue},bg=${thm_bg}] #I: #[fg=${thm_fg},bg=${thm_bg}]#W"

# Statusline - right side
set -g status-right "#[fg=${thm_blue},bg=${thm_bg},nobold,nounderscore,noitalics]#[fg=${thm_bg},bg=${thm_blue},nobold,nounderscore,noitalics] #[fg=${thm_fg},bg=${thm_gray}] #W #{?client_prefix,#[fg=${thm_magenta}],#[fg=${thm_cyan}]}#[bg=${thm_gray}]#{?client_prefix,#[bg=${thm_magenta}],#[bg=${thm_cyan}]}#[fg=${thm_bg}] #[fg=${thm_fg},bg=${thm_gray}] #S "

# Statusline - left side (empty)
set -g status-left ""

# Modes
set -g clock-mode-colour "${thm_blue}"
set -g mode-style "fg=${thm_blue} bg=${thm_black4} bold"

# ============================================================
# TPM - Tmux Plugin Manager
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

# ============================================================
# Session Persistence
# ============================================================

# Save and restore sessions, windows, and panes
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save and restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions every 15 minutes
set -g @continuum-save-interval '15'

# Automatically restore sessions when tmux starts
set -g @continuum-restore 'on'

# Preserve scrollback history
set -g @resurrect-capture-pane-contents 'on'

# Restore Neovim using session files
set -g @resurrect-strategy-nvim 'session'

# ============================================================
# TPM Initialization - MUST BE LAST
# ============================================================

if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
