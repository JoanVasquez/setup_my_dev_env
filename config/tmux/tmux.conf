# ============================================================
# Configuration reload
# ============================================================

unbind r

bind R source-file ~/.tmux.conf \;\
    display-message "Tmux configuration reloaded!"

# ============================================================
# FZF Session Picker
# ============================================================

bind r display-popup \
    -E \
    -w 65% \
    -h 50% \
    -T " 󰆍 Tmux Sessions " \
    '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/session-picker.sh"'

# Basic settings
set -g default-terminal "tmux-256color"
# Advertise true color only for terminals known to support it.
set -as terminal-features ',xterm*:RGB,screen*:RGB,tmux*:RGB,foot*:RGB,alacritty:RGB'
set -sg escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g mouse on
set -g set-clipboard on
set-option -g status-position top

unbind C-b
set -g prefix C-Space
bind-key C-Space send-prefix

unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# Create windows in the active pane's directory.
bind c new-window -c "#{pane_current_path}"
# Resize repeatedly while the prefix remains active.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind z resize-pane -Z
bind ? list-keys

# Vim-style pane navigation
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Start numbering
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind -n S-Left previous-window
bind -n S-Right next-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Keep mouse selections available for review; press y to copy.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi Escape send-keys -X cancel
# Prefer the desktop clipboard when available; OSC 52 remains enabled above.
if-shell 'command -v xclip >/dev/null 2>&1 && test -n "$DISPLAY"' \
    'set -s copy-command "xclip -in -selection clipboard >/dev/null 2>&1"'
if-shell 'command -v wl-copy >/dev/null 2>&1 && test -n "$WAYLAND_DISPLAY"' \
    'set -s copy-command "wl-copy"'

# ============================================================
# Catppuccin Mocha styling (native tmux; no theme plugin required)
# ============================================================

set -g @thm_bg '#1e1e2e'
set -g @thm_fg '#cdd6f4'
set -g @thm_surface_0 '#313244'
set -g @thm_surface_2 '#585b70'
set -g @thm_mauve '#cba6f7'
set -g @thm_peach '#fab387'
set -g @thm_green '#a6e3a1'
set -g @thm_yellow '#f9e2af'
set -g @thm_red '#f38ba8'
set -g @thm_blue '#89b4fa'
set -g @thm_lavender '#b4befe'
set -g @thm_pink '#f5c2e7'

# Let the terminal background show through; keep the window list centered.
set -g status on
set -g status-style 'bg=default,fg=#{@thm_fg}'
set -g status-justify absolute-centre
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator '  '
set -g window-status-style 'bg=default,fg=#{@thm_surface_2}'
set -g window-status-current-style 'bg=default,fg=#{@thm_fg},bold'
set -g window-status-activity-style 'bg=default,fg=#{@thm_yellow}'
set -g window-status-bell-style 'bg=default,fg=#{@thm_red},bold'

# Icons for windows 1-9; larger indices keep their readable numeric value.
set -g window-status-format '#[fg=#{@thm_surface_2}]#("${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/number.sh" #I) #W#{?window_activity_flag, 󰃐,}#{?window_bell_flag, 󰂞,}'
set -g window-status-current-format '#[fg=#{@thm_peach},bold]#("${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/number.sh" #I) #[fg=#{@thm_fg},bold]#W#{?window_zoomed_flag, 󰁌,}'

# Explicit PREFIX/COPY/NORMAL state, session name, and current directory.
set -g status-left '#{?client_prefix,#[fg=#{@thm_mauve} bold]󱗜 PREFIX ,#{?#{==:#{pane_mode},copy-mode},#[fg=#{@thm_yellow} bold]󱗜 COPY ,#[fg=#{@thm_green} bold]󱗜 NORMAL }}#[fg=#{@thm_red} bold] 󰙀 #S #[fg=#{@thm_blue} bold] 󰉖 #{b:pane_current_path} #[default]'

# Session dots use session IDs, so names containing spaces stay safe.
# Keep this set before TPM: Continuum appends its periodic-save hook here.
set -g status-right '#[fg=#{@thm_fg}]#("${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/status.sh" sessions #{q:session_id}) #[fg=#{@thm_mauve}]󰄉 #("${XDG_CONFIG_HOME:-$HOME/.config}/tmux/scripts/status.sh" uptime) #[fg=#{@thm_lavender}]󰅐 %I:%M %p #[fg=#{@thm_pink}]󰃭 %a %d #[default]'

set -g message-style 'fg=#{@thm_fg},bg=#{@thm_surface_0}'
set -g message-command-style 'fg=#{@thm_peach},bg=#{@thm_surface_0}'
set -g pane-border-style 'fg=#{@thm_surface_2}'
set -g pane-active-border-style 'fg=#{@thm_mauve}'
set -g pane-border-status top
set -g pane-border-format '#[fg=#{@thm_surface_2}] #{pane_index} #{pane_current_command} #{?pane_active,#[fg=#{@thm_mauve}]󰁔,} '
set -g clock-mode-colour '#89b4fa'
set -g mode-style 'fg=#{@thm_peach},bg=#{@thm_surface_0},bold'

# ============================================================
# TPM - Tmux Plugin Manager
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

# ============================================================
# Session Persistence
# ============================================================

# Save and restore sessions, windows, and panes
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Automatically save and restore sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions every 15 minutes
set -g @continuum-save-interval '15'

# Automatically restore sessions when tmux starts
set -g @continuum-restore 'on'

# Preserve scrollback history
set -g @resurrect-capture-pane-contents 'on'

# Restore Neovim using session files
set -g @resurrect-strategy-nvim 'session'

# ============================================================
# TPM Initialization - MUST BE LAST
# ============================================================

if-shell 'test -x ~/.tmux/plugins/tpm/tpm' 'run-shell ~/.tmux/plugins/tpm/tpm'
